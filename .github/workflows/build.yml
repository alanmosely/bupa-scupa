name: Windows validation
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'src/**'
      - 'scripts/**'
      - 'test/**'
      - 'assets/**'
      - 'package*.json'
      - 'vendor-lock.json'
      - 'tsconfig.json'
      - 'eslint.config.js'
      - '.github/workflows/**'
      - 'LICENSE'
      - 'NOTICE'
      - 'PRIVACY.md'
      - 'AGENT_API.md'
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022 # Xpdf's build recipe requires Visual Studio 2022.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SCUPA_REQUIRE_PDF_TESTS: '1'
          SCUPA_REQUIRE_FFMPEG_SOURCE: '1'
      - run: npm run test:desktop
      - run: npm run test:portal
      - run: node scripts/smoke.js --packaged --browser --cancel-parse
      - run: node scripts/agent-smoke.js
      - run: node scripts/agent-smoke.js --portable
      - run: node scripts/portable-overlap.js
      - run: node scripts/agent-cancel-smoke.js
      - run: npm run release:source
      - run: npm run release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bupa-scupa-windows
          path: |
            dist/bupa-scupa-x64.exe
            dist/bupa-scupa-*-x64.zip
            dist/bupa-scupa-*-source.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
