name: Windows preview
on: workflow_dispatch
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022 # Xpdf's build recipe requires Visual Studio 2022.
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          SCUPA_REQUIRE_PDF_TESTS: '1'
          SCUPA_REQUIRE_FFMPEG_SOURCE: '1'
      - run: npm run test:desktop
      - run: npm run test:portal
      - run: node scripts/smoke.js --packaged --browser --cancel-parse
      - run: node scripts/agent-smoke.js
      - run: node scripts/agent-smoke.js --portable
      - run: node scripts/portable-overlap.js
      - run: node scripts/agent-cancel-smoke.js
      - run: npm run release:source
      - run: npm run release:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bupa-scupa-windows-preview
          path: |
            dist/*.exe
            dist/*.zip
            dist/SHA256SUMS.txt
          retention-days: 14
