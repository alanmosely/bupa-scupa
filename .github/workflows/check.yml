name: Checks
on:
  push:
    branches-ignore:
      - 'dependabot/**'
    tags:
      - '**'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm run vendor -- --pdf-only
      - run: npm test
        env:
          SCUPA_REQUIRE_PDF_TESTS: '1'
      - run: npm audit
